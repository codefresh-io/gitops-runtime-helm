## Values for the first runtime in a multi-runtime cluster (installing CRDs on the cluster)
global:
  runtime:
    isConfigurationRuntime: true
argo-cd:
  crds:
    install: true
argo-workflows:
  crds:
    install: true
# gitops-operator is disabled by default (End-of-Life).
gitops-operator:
  crds:
    install: true
